; PlatformIO Project Configuration File for 5-DOF Robotic Arm (ESP32)
;
; Toolchain: PlatformIO Core / Espressif 32
; Target: ESP32-WROOM-32 / NodeMCU-32S
; Framework: Arduino

[platformio]
default_envs = esp32dev
description = Astari Selah: Bare-metal C++ firmware for 5-DOF robotic arm with D-H Kinematics, PCA9685 servo control, FSR feedback, and 50Hz ROS 2 serial telemetry.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Serial communication configuration (aligned with ROS 2 esp32_bridge)
monitor_speed = 115200
monitor_filters = default, time
upload_speed = 921600

; Library Dependencies
lib_deps =
    adafruit/Adafruit PWM Servo Driver Library@^3.0.2
    SPI
    Wire

; Compiler flags & optimizations
build_flags =
    -O2
    -Wall
    -DCORE_DEBUG_LEVEL=0
    -DCONFIG_ARDUHAL_LOG_COLORS=1
