# Software Joint Limits for 70 cm Hybrid Stepper-Servo 5-DOF Manipulator
joint_limits:
  joint1_base_yaw:
    has_position_limits: true
    min_position: 0.1745   # 10.0 degrees
    max_position: 2.9671   # 170.0 degrees
    has_velocity_limits: true
    max_velocity: 2.0944   # 120.0 deg/s
    has_effort_limits: true
    max_effort: 15.0       # 10:1 Geared NEMA 17 (~15 N-m holding torque)

  joint2_shoulder_pitch:
    has_position_limits: true
    min_position: 0.0      # 0.0 degrees (horizontal)
    max_position: 1.5708   # 90.0 degrees (vertical upright)
    has_velocity_limits: true
    max_velocity: 1.5708   # 90.0 deg/s
    has_effort_limits: true
    max_effort: 18.0       # 10:1 Geared NEMA 17 (~18 N-m holding torque)

  joint3_elbow_pitch:
    has_position_limits: true
    min_position: 0.0      # 0.0 degrees (co-linear with upper arm)
    max_position: 2.0944   # 120.0 degrees
    has_velocity_limits: true
    max_velocity: 2.5000   # 143.0 deg/s
    has_effort_limits: true
    max_effort: 8.0        # 5:1 Geared NEMA 17 (~8 N-m holding torque)

  joint4_wrist_pitch:
    has_position_limits: true
    min_position: -1.5708  # -90.0 degrees
    max_position: 1.5708   # +90.0 degrees
    has_velocity_limits: true
    max_velocity: 3.1416   # 180.0 deg/s
    has_effort_limits: true
    max_effort: 1.2        # TowerPro MG996R (~11 kg-cm / 1.1 Nm)

  joint5_gripper_left:
    has_position_limits: true
    min_position: 0.0      # 0.0 degrees (closed)
    max_position: 0.7854   # 45.0 degrees (80mm jaw span)
    has_velocity_limits: true
    max_velocity: 2.0944   # 120.0 deg/s
    has_effort_limits: true
    max_effort: 1.2        # TowerPro MG996R
