controller_manager:
  ros__parameters:
    update_rate: 100 # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController

arm_controller:
  ros__parameters:
    joints:
      - joint1_base_yaw
      - joint2_shoulder_pitch
      - joint3_elbow_pitch
      - joint4_wrist_pitch
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    open_loop_control: false
    allow_integration_in_goal_trajectories: true
    gains:
      joint1_base_yaw: {p: 120.0, i: 2.0, d: 15.0}
      joint2_shoulder_pitch: {p: 250.0, i: 5.0, d: 35.0}
      joint3_elbow_pitch: {p: 150.0, i: 3.0, d: 20.0}
      joint4_wrist_pitch: {p: 50.0, i: 1.0, d: 5.0}

gripper_controller:
  ros__parameters:
    joints:
      - joint5_gripper_left
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    gains:
      joint5_gripper_left: {p: 40.0, i: 0.5, d: 4.0}
